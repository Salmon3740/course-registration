<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Registration System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

    <div class="auth-box glass-panel">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join us and manage your studies effectively.</p>

        <div th:if="${errorMessage}" class="alert alert-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/web/register}" method="POST">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
            </div>

            <div class="input-group">
                <label for="secretKey">Admin Secret Key <span style="font-weight:400; font-size:0.85rem; opacity:0.6;">(optional)</span></label>
                <input type="password" id="secretKey" name="secretKey" placeholder="Enter admin key to register as admin">
                <small style="display:block; margin-top:4px; opacity:0.55; font-size:0.8rem;">
                    Leave blank to register as a Student. Enter the secret key if you are an admin.
                </small>
            </div>

            <button type="submit" class="btn primary-btn btn-block">Register</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign In</a>
        </p>
    </div>

</body>

</html>
